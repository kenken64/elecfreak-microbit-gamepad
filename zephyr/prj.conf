# ---------------------------------------------------------------------------
# micro:bit V2 + Joystick:bit V1 -> Bluetooth LE HID gamepad
#
# NOTE: after editing this file PlatformIO re-runs CMake automatically.
# ---------------------------------------------------------------------------

# --- Application -----------------------------------------------------------
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_DISPLAY=y
CONFIG_MICROBIT_DISPLAY=y
CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=2048
# Settings (bond storage) runs on the system work queue
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# --- Bluetooth LE peripheral -----------------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_DEVICE_NAME="micro:bit Gamepad"
# 0x03C4 = HID Gamepad
CONFIG_BT_DEVICE_APPEARANCE=964

# --- Pairing / bonding -----------------------------------------------------
# Windows only talks to HID-over-GATT devices over an encrypted, bonded link.
# No display/keyboard on our side -> "Just Works" pairing.
CONFIG_BT_SMP=y
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
# Lets Windows re-pair after "Remove device" without wiping the micro:bit first
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y

# Persist bonds in flash (storage_partition) so Windows reconnects after reset
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# --- Low-latency connection (7.5 - 15 ms interval) -------------------------
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# --- Standard services Windows expects next to HID -------------------------
CONFIG_BT_BAS=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=y
# Vendor ID source 2 = USB-IF. 1209:0001 is the pid.codes "Test PID" for
# private/hobby use; get your own PID from pid.codes if you distribute this.
CONFIG_BT_DIS_PNP_VID_SRC=2
CONFIG_BT_DIS_PNP_VID=0x1209
CONFIG_BT_DIS_PNP_PID=0x0001
CONFIG_BT_DIS_PNP_VER=0x0100
CONFIG_BT_DIS_MANUF_NAME_STR="DIY"
CONFIG_BT_DIS_MODEL_NUMBER_STR="micro:bit Joystick:bit gamepad"
