<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="gp-token" content="__GP_TOKEN__">
<title>Gamepad Blocks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: toolbar on top, Blockly workspace left, generated main.cpp / build log right */
:root {
  --bg: #f9fafc;
  --panel: #ffffff;
  --ink: #1b2130;
  --muted: #5b6577;
  --line: #dde2ea;
  --code-bg: #f3f5f9;
  --accent: #d9480f;      /* the Gamepad category colour */
  --accent-ink: #ffffff;
  --ok: #157f3b;
  --warn: #a35a00;
  --err: #c0262d;
  --f-display: "Fredoka", "Nunito", system-ui, sans-serif;
  --f-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141821; --panel: #1b202b; --ink: #e7ebf3; --muted: #9aa4b6; --line: #2a3242;
    --code-bg: #11151d; --accent: #f06a2e; --ok: #4cc27a; --warn: #f0b04a; --err: #ff6b6b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141821; --panel: #1b202b; --ink: #e7ebf3; --muted: #9aa4b6; --line: #2a3242;
  --code-bg: #11151d; --accent: #f06a2e; --ok: #4cc27a; --warn: #f0b04a; --err: #ff6b6b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 14px/1.5 var(--f-body);
  display: flex; flex-direction: column;
}
[hidden] { display: none !important; }

.bar {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; min-width: 0; }
.brand b { font: 600 20px/1.2 var(--f-display); letter-spacing: -.01em; }
.brand span { font: 12px var(--f-mono); color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.status { font-size: 13px; color: var(--muted); max-width: 46ch; }
.status.ok { color: var(--ok); }
.status.warn { color: var(--warn); }
.status.err { color: var(--err); }

button {
  font: 700 13.5px/1 var(--f-body); color: var(--ink);
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 9px 14px; cursor: pointer;
}
button:hover:not(:disabled) { border-color: var(--muted); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .5; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.small { padding: 6px 10px; font-size: 12.5px; }
button.armed { border-color: var(--err); color: var(--err); }
.help-link { display: inline-block; text-decoration: none; font: 700 13.5px/1 var(--f-body); color: var(--accent); background: var(--panel); border: 1px solid var(--accent); border-radius: 8px; padding: 9px 14px; }
.help-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.split { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 38%); }
.ws { position: relative; min-width: 0; min-height: 0; }
.side { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-left: 1px solid var(--line); background: var(--panel); }
.tabs { display: flex; align-items: center; gap: 4px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.tabs .tab { border: 0; background: none; border-radius: 6px; padding: 7px 10px; color: var(--muted); }
.tabs .tab.on { background: var(--code-bg); color: var(--ink); }
.tabs .spacer { flex: 1; }
.code {
  flex: 1; min-height: 0; margin: 0; overflow: auto;
  padding: 14px 16px; background: var(--code-bg);
  font: 12.5px/1.6 var(--f-mono); tab-size: 4; white-space: pre;
}
.code .k { color: #8a3ffc; }
.code .s { color: #0f7b6c; }
.code .c { color: var(--muted); font-style: italic; }
.code .f { color: #c2410c; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .code .k { color: #c4a7ff; }
  :root:not([data-theme="light"]) .code .s { color: #5fd3bc; }
  :root:not([data-theme="light"]) .code .f { color: #ffa36b; }
}
:root[data-theme="dark"] .code .k { color: #c4a7ff; }
:root[data-theme="dark"] .code .s { color: #5fd3bc; }
:root[data-theme="dark"] .code .f { color: #ffa36b; }

@media (max-width: 860px) {
  .split { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(360px, 60%) minmax(240px, 1fr); }
  .side { border-left: 0; border-top: 1px solid var(--line); }
}
</style>
<script src="https://unpkg.com/blockly@11.1.1/blockly.min.js"></script>
<script src="gp_blocks.js"></script>
</head>
<body>
<header class="bar">
  <div class="brand">
    <b>Gamepad Blocks</b>
    <span>blocks/gamepad.json &rarr; src/v1/main.cpp</span>
  </div>
  <div class="actions">
    <span id="status" class="status" role="status" aria-live="polite">Loading&hellip;</span>
    <a id="btn-help" class="help-link" href="solution.html" target="gamepad-solution" title="Open the complete solution in a separate window">? Solution help</a>
    <button id="btn-saved" type="button" disabled title="Open the previously saved project">Open saved</button>
    <button id="btn-default" type="button" title="Replace the blocks with the program that matches the hand-written firmware">Load firmware default</button>
    <button id="btn-save" type="button">Save</button>
    <button id="btn-download" type="button" class="primary" title="Save, build the firmware on this PC and download microbit-gamepad.hex">Download</button>
  </div>
</header>
<main class="split">
  <div id="ws" class="ws" aria-label="Block workspace"></div>
  <aside class="side">
    <div class="tabs" role="tablist">
      <button class="tab on" type="button" role="tab" data-tab="code" aria-selected="true">main.cpp</button>
      <button class="tab" type="button" role="tab" data-tab="log" aria-selected="false">Build log</button>
      <span class="spacer"></span>
      <button id="btn-copy" class="small" type="button">Copy C++</button>
    </div>
    <pre id="code" class="code" tabindex="0" aria-label="Generated main.cpp"></pre>
    <pre id="log" class="code" tabindex="0" aria-label="Build log" hidden>No build yet. "Download" builds the firmware on this PC with PlatformIO and shows its output here as it runs.</pre>
  </aside>
</main>
<pre id="gp-generated" hidden></pre>
<pre id="gp-program" hidden></pre>

<script>
(function () {
	'use strict';

	var params = new URLSearchParams(location.search);
	var headless = params.has('generate');
	var token = document.querySelector('meta[name="gp-token"]').content;
	var served = /^https?:$/.test(location.protocol) && token && token.indexOf('GP_TOKEN') < 0;

	var mq = window.matchMedia('(prefers-color-scheme: dark)');
	var themes = {light: GP.theme(false), dark: GP.theme(true)};

	var ws = Blockly.inject('ws', {
		toolbox: GP.toolbox,
		renderer: 'zelos',
		theme: mq.matches ? themes.dark : themes.light,
		grid: {spacing: 24, length: 2, colour: mq.matches ? '#283040' : '#cfd6e2', snap: true},
		zoom: {controls: true, wheel: true, startScale: 0.75, maxScale: 2, minScale: 0.3, scaleSpeed: 1.15},
		move: {scrollbars: true, drag: true, wheel: false},
		trashcan: true,
	});
	ws.addChangeListener(Blockly.Events.disableOrphans);
	if (mq.addEventListener) {
		mq.addEventListener('change', function (e) {
			ws.setTheme(e.matches ? themes.dark : themes.light);
		});
	}

	var codeEl = document.getElementById('code');
	var logEl = document.getElementById('log');
	var statusEl = document.getElementById('status');
	var btnSave = document.getElementById('btn-save');
	var btnDownload = document.getElementById('btn-download');
	var btnDefault = document.getElementById('btn-default');
	var btnSaved = document.getElementById('btn-saved');
	var btnHelp = document.getElementById('btn-help');
	var btnCopy = document.getElementById('btn-copy');

	var dirty = false;
	var busy = false;
	var lastCode = '';
	var savedProgram = null;
	var savedKnown = false;
	var replacingSaved = false;

	btnHelp.addEventListener('click', function (e) {
		var help = window.open(btnHelp.href, 'gamepad-solution', 'popup,width=1100,height=800,resizable=yes,scrollbars=yes');
		if (help) { e.preventDefault(); help.focus(); }
	});

	function setStatus(text, kind) {
		statusEl.textContent = text;
		statusEl.className = 'status' + (kind ? ' ' + kind : '');
	}

	function escapeHtml(s) {
		return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
	}

	/* Tiny C++ highlighter for the preview */
	function highlight(code) {
		return code.split('\n').map(function (line) {
			var esc = escapeHtml(line);
			var cm = esc.indexOf('/*') >= 0 ? esc.indexOf('/*') : (/^\s*\*/.test(esc) ? esc.search(/\S/) : -1);
			var body = cm >= 0 ? esc.slice(0, cm) : esc;
			var comment = cm >= 0 ? '<span class="c">' + esc.slice(cm) + '</span>' : '';
			body = body
				.replace(/"(?:[^"\\]|\\.)*"/g, function (m) { return '<span class="s">' + m + '</span>'; })
				.replace(/'[^']'/g, function (m) { return '<span class="s">' + m + '</span>'; })
				.replace(/\b(if|else|return|void|bool|int|true|false)\b/g, '<span class="k">$1</span>')
				.replace(/(#include)/g, '<span class="k">$1</span>')
				.replace(/\b(gp_\w+)(?=\()/g, '<span class="f">$1</span>');
			return body + comment;
		}).join('\n');
	}

	function refresh() {
		var problems = GP.checkWorkspace(ws);
		lastCode = GP.generateMainCpp(ws);
		codeEl.innerHTML = highlight(lastCode);
		if (problems.length) {
			setStatus('Check the blocks: ' + problems.join(', ') + '.', 'warn');
		}
		return problems;
	}

	var timer = 0;
	function scheduleRefresh() {
		clearTimeout(timer);
		timer = setTimeout(refresh, 120);
	}

	function load(program) {
		Blockly.Events.disable();
		try {
			ws.clear();
			Blockly.serialization.workspaces.load(program, ws);
		} finally {
			Blockly.Events.enable();
		}
		refresh();
	}

	async function loadSavedProgramForHeadless() {
		try {
			var response = await fetch('/api/program', {cache: 'no-store'});
			if (response.ok) {
				var data = await response.json();
				return data.program || {};
			}
		} catch (err) {
			/* file:// or a plain static server: fall back to the JSON file */
		}
		var file = await fetch('/blocks/gamepad.json', {cache: 'no-store'});
		if (!file.ok) {
			throw new Error('could not read blocks/gamepad.json (HTTP ' + file.status + ')');
		}
		return file.json();
	}

	/* ---- headless generation (used by tools/check_blocks.py) ---- */
	if (headless) {
		var headlessProgram = params.get('generate') === 'saved'
			? loadSavedProgramForHeadless()
			: Promise.resolve(GP.defaultProgram());

		headlessProgram.then(function (program) {
			load(program);
			document.getElementById('gp-generated').textContent = lastCode;
			document.getElementById('gp-program').textContent =
				JSON.stringify(Blockly.serialization.workspaces.save(ws), null, 2);
			document.documentElement.setAttribute('data-generated', 'yes');
		}).catch(function (err) {
			var message = err && err.message ? err.message : String(err);
			document.getElementById('gp-generated').textContent = 'ERROR: ' + message;
			document.documentElement.setAttribute('data-generated', 'error');
			setStatus('Headless generation failed: ' + message, 'err');
		});
		return;
	}

	ws.addChangeListener(function (e) {
		if (e.isUiEvent) {
			return;
		}
		if (!dirty) {
			dirty = true;
			setStatus('Unsaved changes', '');
		}
		scheduleRefresh();
	});

	function showTab(name) {
		document.querySelectorAll('.tab').forEach(function (t) {
			var on = t.getAttribute('data-tab') === name;
			t.classList.toggle('on', on);
			t.setAttribute('aria-selected', on ? 'true' : 'false');
		});
		codeEl.hidden = name !== 'code';
		logEl.hidden = name !== 'log';
	}
	document.querySelectorAll('.tab').forEach(function (t) {
		t.addEventListener('click', function () { showTab(t.getAttribute('data-tab')); });
	});

	function setBusy(on) {
		busy = on;
		btnSave.disabled = on || !served;
		btnDownload.disabled = on || !served;
		btnDefault.disabled = on;
		btnSaved.disabled = on || !savedProgram;
	}

	function post(path, body) {
		return fetch(path, {
			method: 'POST',
			headers: {'Content-Type': 'application/json', 'X-GP-Token': token},
			body: JSON.stringify(body || {}),
		}).then(function (r) {
			return r.json().catch(function () { return {}; }).then(function (data) {
				if (!r.ok) {
					throw new Error(data.error || ('HTTP ' + r.status));
				}
				return data;
			});
		});
	}

	function save() {
		var problems = refresh();
		if (problems.length) {
			return Promise.reject(new Error('Fix the blocks first: ' + problems.join(', ')));
		}
		if (!savedKnown) {
			return Promise.reject(new Error('The saved project could not be checked. Reload before saving.'));
		}
		if (replacingSaved && !window.confirm('Saving will replace the previously saved project. Continue?')) {
			return Promise.reject(new Error('Save cancelled. Your previously saved project is unchanged.'));
		}
		var program = Blockly.serialization.workspaces.save(ws);
		return post('/api/save', {
			program: program,
			code: lastCode,
		}).then(function (data) {
			dirty = false;
			savedProgram = program;
			replacingSaved = false;
			return data;
		});
	}

	btnSave.addEventListener('click', function () {
		if (busy) {
			return;
		}
		setBusy(true);
		setStatus('Saving…', '');
		save().then(function (data) {
			setStatus('Saved ' + data.files.join(' and ') + ' at ' + new Date().toLocaleTimeString(), 'ok');
		}).catch(function (err) {
			setStatus(err.message, 'err');
		}).then(function () { setBusy(false); });
	});

	var RESULT_MARK = '@@GP_RESULT ';

	function appendLog(text) {
		logEl.appendChild(document.createTextNode(text));
		logEl.scrollTop = logEl.scrollHeight;
	}

	/* Run "pio run" on the server and show its output as it arrives. */
	function streamBuild() {
		return fetch('/api/build', {
			method: 'POST',
			headers: {'Content-Type': 'application/json', 'X-GP-Token': token},
			body: '{}',
		}).then(function (r) {
			if (!r.ok) {
				return r.json().catch(function () { return {}; }).then(function (d) {
					throw new Error(d.error || ('HTTP ' + r.status));
				});
			}
			var reader = r.body.getReader();
			var decoder = new TextDecoder();
			var pending = '';
			var result = null;

			function handle(line) {
				if (line.indexOf(RESULT_MARK) === 0) {
					try { result = JSON.parse(line.slice(RESULT_MARK.length)); } catch (e) { result = {ok: false}; }
					return;
				}
				line = line.replace(/\x1b\[[0-9;]*m/g, '');
				appendLog(line + '\n');
				var shown = line.trim();
				if (shown) {
					setStatus('Building on this PC: ' + (shown.length > 70 ? shown.slice(0, 67) + '…' : shown), '');
				}
			}

			function pump() {
				return reader.read().then(function (chunk) {
					if (chunk.done) {
						if (pending) {
							handle(pending);
						}
						return result || {ok: false};
					}
					pending += decoder.decode(chunk.value, {stream: true});
					var lines = pending.split('\n');
					pending = lines.pop();
					lines.forEach(handle);
					return pump();
				});
			}
			return pump();
		});
	}

	function downloadHex() {
		var a = document.createElement('a');
		a.href = '/api/firmware.hex?t=' + Date.now();
		a.download = 'microbit-gamepad.hex';
		document.body.appendChild(a);
		a.click();
		a.remove();
	}

	btnDownload.addEventListener('click', function () {
		if (busy) {
			return;
		}
		setBusy(true);
		setStatus('Saving…', '');
		logEl.textContent = '';
		showTab('log');
		save().then(function () {
			return streamBuild();
		}).then(function (result) {
			if (result.ok) {
				downloadHex();
				appendLog('\nDownloaded microbit-gamepad.hex.\n' +
					'Next: drag it from your Downloads onto the MICROBIT drive. The yellow light flashes while it copies.\n' +
					'If the gamepad then stays on the square, remove "micro:bit Gamepad" in Windows Bluetooth settings and pair again.\n');
				setStatus('Downloaded microbit-gamepad.hex. Drag it onto the MICROBIT drive.', 'ok');
			} else {
				setStatus('The build failed. See the build log.', 'err');
			}
		}).catch(function (err) {
			setStatus(err.message, 'err');
		}).then(function () { setBusy(false); });
	});

	var armTimer = 0;
	btnSaved.addEventListener('click', function () {
		if (!savedProgram || (dirty && !window.confirm('Replace your unsaved blocks with the saved project?'))) { return; }
		load(savedProgram);
		dirty = false;
		replacingSaved = false;
		setStatus('Opened your saved project.', 'ok');
	});
	btnDefault.addEventListener('click', function () {
		if (!btnDefault.classList.contains('armed')) {
			btnDefault.classList.add('armed');
			btnDefault.textContent = 'Click again to replace your blocks';
			armTimer = setTimeout(function () {
				btnDefault.classList.remove('armed');
				btnDefault.textContent = 'Load firmware default';
			}, 4000);
			return;
		}
		clearTimeout(armTimer);
		btnDefault.classList.remove('armed');
		btnDefault.textContent = 'Load firmware default';
		load(GP.defaultProgram());
		dirty = true;
		replacingSaved = !!savedProgram;
		setStatus('Loaded the firmware default. Save to keep it.', '');
	});

	btnCopy.addEventListener('click', function () {
		var done = function () { btnCopy.textContent = 'Copied'; setTimeout(function () { btnCopy.textContent = 'Copy C++'; }, 1500); };
		if (navigator.clipboard && navigator.clipboard.writeText) {
			navigator.clipboard.writeText(lastCode).then(done, function () { selectCode(); });
		} else {
			selectCode();
		}
	});
	function selectCode() {
		showTab('code');
		var r = document.createRange();
		r.selectNodeContents(codeEl);
		var sel = window.getSelection();
		sel.removeAllRanges();
		sel.addRange(r);
		setStatus('Code selected: press Ctrl+C to copy.', '');
	}

	window.addEventListener('beforeunload', function (e) {
		if (dirty && served) {
			e.preventDefault();
			e.returnValue = '';
		}
	});

	setBusy(false);
	load({});
	if (!served) {
		dirty = false;
		setStatus('Opened as a file. Run "python tools/blocks_editor.py" to save and upload.', 'warn');
		return;
	}
	setStatus('Start with the Events blocks. Open ? Solution help for a guide.', '');
	fetch('/api/program').then(function (r) {
		if (!r.ok) { throw new Error('HTTP ' + r.status); }
		return r.json();
	}).then(function (data) {
		savedProgram = data.program || null;
		savedKnown = true;
		replacingSaved = !!savedProgram;
		setBusy(false);
	}).catch(function (err) {
		setStatus('Could not check the saved project (' + err.message + '). Reload before saving.', 'err');
	});
})();
</script>
</body>
</html>
