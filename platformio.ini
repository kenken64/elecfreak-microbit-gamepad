; micro:bit + ELECFREAKS Joystick:bit V1  ->  Bluetooth LE HID gamepad (Windows 11)
;
; Build:   pio run                      (builds the default env below)
; Flash:   pio run -t upload            (micro:bit plugged in over USB)
; Logs:    pio device monitor
;
; Which micro:bit do you have?  Open the MICROBIT drive -> DETAILS.TXT:
;   Unique ID starting 9900/9901  -> V1.x  -> env:microbit_v1
;   Unique ID starting 9903+      -> V2.x  -> env:microbit_v2

[platformio]
default_envs = microbit_v1

; ---------------------------------------------------------------------------
; micro:bit V1.x (nRF51822, 16 KB RAM): Arduino nRF5 core + Nordic S130
; SoftDevice (BLE stack, merged into firmware.hex). Sources: src/v1/
; ---------------------------------------------------------------------------
[env:microbit_v1]
platform = nordicnrf51 @ ~10.0.0
board = bbcmicrobit
framework = arduino
build_flags = -DNRF51_S130
build_src_filter = -<*> +<v1/>
extra_scripts =
    pre:tools/v1_softdevice.py
    post:tools/v1_upload.py
upload_protocol = cmsis-dap
monitor_speed = 115200

; ---------------------------------------------------------------------------
; micro:bit V2.x (nRF52833): Zephyr RTOS. Sources: src/*.c, zephyr/
; ---------------------------------------------------------------------------
[env:microbit_v2]
platform = nordicnrf52 @ ~11.0.0
board = bbcmicrobit_v2
framework = zephyr
build_src_filter = +<*> -<v1/>
upload_protocol = cmsis-dap
debug_tool = cmsis-dap
monitor_speed = 115200
