name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Syntax and block generator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Python syntax
        run: python -m py_compile tools/*.py

      - name: JavaScript syntax
        run: |
          node --check tools/blocks_editor/gp_blocks.js
          node --check tools/gamepad-tester/app.js

      - name: Input maths tests
        run: python tools/run_tests.py

      - name: Hosted editor and persistent firmware tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Show headless browser
        run: google-chrome --version || chromium --version

      - name: Blocks and generated C++ are in sync
        run: python tools/check_blocks.py

  docker:
    name: Railway Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build image and bundled V1 firmware
        run: docker build -t microbit-gamepad:ci .

  build:
    name: Build ${{ matrix.env }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        env: [microbit_v1, microbit_v2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('platformio.ini', 'zephyr/prj.conf', 'zephyr/app.overlay') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ matrix.env }}-

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build
        run: pio run -e ${{ matrix.env }}
